<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080817">
<title>Neon Tic Tac Toe</title>
<style>
:root{--bg:#080817;--panel:#111128;--cyan:#39f5ff;--pink:#ff4fd8;--text:#f5f7ff;--muted:#9aa0c5;--line:#27274c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 10%,#20204b 0,transparent 42%),radial-gradient(ellipse at 90% 85%,#35143e 0,transparent 38%),var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);display:flex;justify-content:center;align-items:center;padding:22px}.app{width:min(100%,520px)}header{text-align:center;margin-bottom:22px}h1{font-size:clamp(2rem,7vw,3.3rem);margin:0;letter-spacing:2px;font-weight:900;background:linear-gradient(90deg,var(--cyan),#fff,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px #39f5ff33)}.sub{color:var(--muted);margin:7px 0 0;letter-spacing:3px;font-size:.75rem;text-transform:uppercase}.panel{background:#111128d9;border:1px solid #34345d;border-radius:22px;padding:18px;box-shadow:0 18px 70px #0008;backdrop-filter:blur(12px)}.mode-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.pill,select,button{font:inherit;color:var(--text);border:1px solid #38385f;background:#191936;border-radius:12px;padding:11px 12px;cursor:pointer}.pill.active{border-color:var(--cyan);box-shadow:0 0 15px #39f5ff22;color:var(--cyan)}.settings{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px;color:var(--muted);font-size:.9rem}.settings select{padding:8px;max-width:58%}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.score{border:1px solid var(--line);border-radius:14px;padding:11px 4px;text-align:center;background:#0c0c20}.score b{display:block;font-size:1.5rem}.score span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.score.x b{color:var(--cyan)}.score.o b{color:var(--pink)}.status{text-align:center;color:var(--muted);margin:0 0 14px;min-height:24px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cell{aspect-ratio:1;border-radius:17px;border:1px solid #34345f;background:linear-gradient(145deg,#191932,#101024);font-size:clamp(2.7rem,13vw,4.5rem);font-weight:800;display:grid;place-items:center;transition:transform .15s,border-color .15s,background .15s;min-width:0}.cell:enabled:hover{transform:translateY(-2px);border-color:#7777a8}.cell.x{color:var(--cyan);text-shadow:0 0 18px #39f5ff88;border-color:#39f5ff77}.cell.o{color:var(--pink);text-shadow:0 0 18px #ff4fd888;border-color:#ff4fd877}.cell.win{background:#244344;border-color:var(--cyan);animation:pulse .8s infinite alternate}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.actions button{font-weight:700}.primary{background:linear-gradient(100deg,#12616a,#49305f);border-color:#39f5ff77}.foot{text-align:center;color:#6d7198;font-size:.75rem;margin-top:14px}.hidden{display:none}@keyframes pulse{to{box-shadow:0 0 20px #39f5ff44}}@media(max-width:380px){body{padding:12px}.panel{padding:13px}.board{gap:7px}.cell{border-radius:13px}}
</style></head><body><main class="app"><header><h1>NEON TIC TAC TOE</h1><p class="sub">Think fast · Play smart</p></header><section class="panel"><div class="mode-row"><button id="aiMode" class="pill active">🤖 Play vs AI</button><button id="twoMode" class="pill">👥 Two Players</button></div><div class="settings" id="difficultyRow"><label for="difficulty">AI difficulty</label><select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></div><div class="scores"><div class="score x"><b id="xScore">0</b><span>Player X</span></div><div class="score"><b id="drawScore">0</b><span>Draws</span></div><div class="score o"><b id="oScore">0</b><span id="oLabel">AI · O</span></div></div><p id="status" class="status">Your turn — X goes first</p><div class="board" id="board" aria-label="Tic tac toe board"></div><div class="actions"><button class="primary" id="restart">↻ New Round</button><button id="reset">Reset Scores</button></div></section><p class="foot">A tiny game with a neon-sized attitude ✦</p></main>
<script>
(()=>{const $=id=>document.getElementById(id);let board=Array(9).fill(''),turn='X',mode='ai',over=false,scores={X:0,O:0,D:0},winLine=[];const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function result(b=board){for(const line of wins)if(b[line[0]]&&b[line[0]]===b[line[1]]&&b[line[1]]===b[line[2]])return {winner:b[line[0]],line};if(b.every(Boolean))return {winner:'D',line:[]};return null}function render(){const el=$('board');el.innerHTML='';board.forEach((v,i)=>{const b=document.createElement('button');b.className='cell'+(v?' '+v.toLowerCase():'')+(winLine.includes(i)?' win':'');b.textContent=v;b.setAttribute('aria-label',`Cell ${i+1}${v?', '+v:''}`);b.disabled=over||!!v||(mode==='ai'&&turn==='O');b.onclick=()=>play(i);el.appendChild(b)});$('xScore').textContent=scores.X;$('oScore').textContent=scores.O;$('drawScore').textContent=scores.D;$('oLabel').textContent=mode==='ai'?'AI · O':'Player O'}function setStatus(t){$('status').textContent=t}function finish(r){over=true;winLine=r.line;if(r.winner==='D'){scores.D++;setStatus("It's a draw! ✨")}else{scores[r.winner]++;setStatus((r.winner==='X'?'X wins! 🎉':(mode==='ai'?'AI wins this round! 🤖':'O wins! 🎉')))}render()}function play(i){if(over||board[i]||(mode==='ai'&&turn==='O'))return;board[i]=turn;const r=result();if(r){finish(r);return}turn=turn==='X'?'O':'X';setStatus(mode==='ai'?(turn==='X'?'Your turn — X':'AI is thinking…'):`Player ${turn}'s turn`);render();if(mode==='ai'&&turn==='O')setTimeout(aiMove,350)}function aiMove(){if(over)return;const d=$('difficulty').value;let move;if(d==='easy'){const empties=board.map((v,i)=>v?null:i).filter(v=>v!==null);move=empties[Math.floor(Math.random()*empties.length)]}else if(d==='medium'){move=winningMove('O');if(move===undefined)move=winningMove('X');if(move===undefined&&board[4]==='')move=4;if(move===undefined)move=randomMove()}else{move=bestMove(board,'O').index}if(move===undefined||move===null)return;board[move]='O';const r=result();if(r)finish(r);else{turn='X';setStatus('Your turn — X');render()}}function winningMove(p){for(let i=0;i<9;i++)if(!board[i]){board[i]=p;const r=result();board[i]='';if(r&&r.winner===p)return i}}function randomMove(){const e=board.map((v,i)=>v?null:i).filter(v=>v!==null);return e[Math.floor(Math.random()*e.length)]}function bestMove(b,p){const r=result(b);if(r)return {score:r.winner==='O'?10:r.winner==='X'?-10:0};let best={score:p==='O'?-Infinity:Infinity,index:null};for(let i=0;i<9;i++)if(!b[i]){b[i]=p;const s=bestMove(b,p==='O'?'X':'O').score;b[i]='';if(p==='O'?s>best.score:s<best.score)best={score:s,index:i}}return best}function newRound(){board=Array(9).fill('');turn='X';over=false;winLine=[];setStatus('Your turn — X goes first');render()}function setMode(m){mode=m;$('aiMode').classList.toggle('active',m==='ai');$('twoMode').classList.toggle('active',m==='two');$('difficultyRow').classList.toggle('hidden',m!=='ai');newRound()}$('aiMode').onclick=()=>setMode('ai');$('twoMode').onclick=()=>setMode('two');$('restart').onclick=newRound;$('reset').onclick=()=>{scores={X:0,O:0,D:0};newRound()};render()})();
</script></body></html>
